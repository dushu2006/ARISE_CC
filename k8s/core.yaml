apiVersion: apps/v1
kind: Deployment
metadata:
  name: arise-core
  namespace: arise
  labels:
    app: arise
    component: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: arise
      component: core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: arise
        component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: arise-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: core
        image: ghcr.io/arise/core:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          value: "postgresql+asyncpg://arise:$(POSTGRES_PASSWORD)@postgres:5432/arise"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: GOOGLE_API_KEY
              optional: true
        - name: PORCUPINE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: PORCUPINE_ACCESS_KEY
              optional: true
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: ELEVENLABS_API_KEY
              optional: true
        - name: MASTER_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: MASTER_ENCRYPTION_KEY
        - name: VAULT_ADDR
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: VAULT_ADDR
              optional: true
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: VAULT_TOKEN
              optional: true
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: arise-secrets
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        resources:
          requests:
            cpu: "1000m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: arise-config
---
apiVersion: v1
kind: Service
metadata:
  name: arise-core
  namespace: arise
  labels:
    app: arise
    component: core
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: arise
    component: core
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arise-core-hpa
  namespace: arise
  labels:
    app: arise
    component: core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arise-core
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
---
