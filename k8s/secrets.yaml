apiVersion: v1
kind: Secret
metadata:
  name: arise-secrets
  namespace: arise
  labels:
    app: arise
    component: secrets
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  # Redis
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  # Model Providers
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  # Voice
  PORCUPINE_ACCESS_KEY: ""
  ELEVENLABS_API_KEY: ""
  # Security
  MASTER_ENCRYPTION_KEY: "CHANGE_ME_32_BYTES_BASE64_ENCODED"
  VAULT_ADDR: ""
  VAULT_TOKEN: ""
  # Telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  OTEL_EXPORTER_OTLP_HEADERS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: arise-secrets-staging
  namespace: arise-staging
  labels:
    app: arise
    component: secrets
    environment: staging
type: Opaque
stringData:
  POSTGRES_PASSWORD: "staging_password"
  REDIS_PASSWORD: "staging_redis_password"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  PORCUPINE_ACCESS_KEY: ""
  ELEVENLABS_API_KEY: ""
  MASTER_ENCRYPTION_KEY: "STAGING_KEY_32_BYTES_BASE64_ENCODED"
  VAULT_ADDR: ""
  VAULT_TOKEN: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"