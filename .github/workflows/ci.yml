name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run E2E tests on Windows weekly
    - cron: '0 2 * * 1'

env:
  POETRY_VERSION: 1.7.1
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # =============================================================================
  # Python Lint & Type Check
  # =============================================================================
  lint-python:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with voice,automation,memory,dev

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Run MyPy
        run: poetry run mypy .

      - name: Run Bandit (security)
        run: poetry run bandit -r . -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: core/bandit-report.json

  # =============================================================================
  # Rust Lint & Test
  # =============================================================================
  lint-rust:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run Rustfmt
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Cargo Audit
        run: cargo install cargo-audit && cargo audit

  # =============================================================================
  # TypeScript Lint & Type Check
  # =============================================================================
  lint-typescript:
    name: TypeScript Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run npm audit
        run: npm audit --json > npm-audit.json || true

      - name: Upload npm audit
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: src/npm-audit.json

  # =============================================================================
  # Python Unit Tests
  # =============================================================================
  test-python-unit:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arise
          POSTGRES_PASSWORD: arise
          POSTGRES_DB: arise
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U arise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with voice,automation,memory,dev

      - name: Run database migrations
        run: poetry run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://arise:arise@localhost:5432/arise
          REDIS_URL: redis://localhost:6379/0

      - name: Run unit tests
        run: poetry run pytest tests/unit -v --tb=short --cov=core --cov-report=xml --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://arise:arise@localhost:5432/arise
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python-unit

  # =============================================================================
  # Python Integration Tests
  # =============================================================================
  test-python-integration:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arise
          POSTGRES_PASSWORD: arise
          POSTGRES_DB: arise
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U arise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with voice,automation,memory,dev

      - name: Run database migrations
        run: poetry run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://arise:arise@localhost:5432/arise
          REDIS_URL: redis://localhost:6379/0

      - name: Run integration tests
        run: poetry run pytest tests/integration -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://arise:arise@localhost:5432/arise
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

  # =============================================================================
  # Python Contract Tests
  # =============================================================================
  test-python-contract:
    name: Python Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with voice,automation,memory,dev

      - name: Run contract tests
        run: poetry run pytest tests/contract -v --tb=short

  # =============================================================================
  # TypeScript Tests
  # =============================================================================
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: typescript

  # =============================================================================
  # Rust Tests
  # =============================================================================
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Run tarpaulin (coverage)
        run: cargo install cargo-tarpaulin && cargo tarpaulin --out Xml --output-dir coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          flags: rust

  # =============================================================================
  # E2E Tests (Windows)
  # =============================================================================
  test-e2e:
    name: E2E Tests (Windows)
    runs-on: windows-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: |
          cd core && poetry install --no-interaction --with voice,automation,memory,dev
          cd ../src && npm ci
          cd ../src-tauri && cargo fetch

      - name: Install Playwright browsers
        run: cd src && npx playwright install chromium firefox webkit

      - name: Start services
        run: |
          # Start PostgreSQL and Redis via Docker
          docker compose -f docker/docker-compose.yml up -d postgres redis
          sleep 10
          # Run migrations
          cd core && poetry run alembic upgrade head
          # Start core server in background
          poetry run uvicorn core.runtime.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          # Build Tauri app
          cd ../src-tauri && cargo tauri build
          # Start frontend
          cd ../src && npm run build && npx serve -s dist -l 5173 &
          sleep 5

      - name: Run E2E tests
        run: cd src && npm run test:run -- tests/e2e

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: src/test-results/

  # =============================================================================
  # Build Artifacts
  # =============================================================================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [lint-python, lint-rust, lint-typescript, test-python-unit, test-typescript, test-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install core dependencies
        run: cd core && poetry install --no-interaction --with voice,automation,memory

      - name: Build core wheel
        run: cd core && poetry build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build frontend
        run: cd src && npm ci && npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri
        run: cd src-tauri && cargo tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            core/dist/
            src/dist/
            src-tauri/target/release/bundle/

      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.core -t arise/core:latest .
          docker build -f docker/Dockerfile.tauri -t arise/tauri:latest .
          docker save arise/core:latest arise/tauri:latest | gzip > docker-images.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images.tar.gz

  # =============================================================================
  # Security Scan
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Safety (Python)
        run: |
          cd core
          pip install safety
          safety check --json > safety-report.json || true

      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: core/safety-report.json

      - name: Run Cargo Audit (Rust)
        run: |
          cd src-tauri
          cargo install cargo-audit
          cargo audit --json > cargo-audit.json || true

      - name: Upload Cargo Audit report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit
          path: src-tauri/cargo-audit.json

  # =============================================================================
  # Summary
  # =============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-python, lint-rust, lint-typescript, test-python-unit, test-python-integration, test-python-contract, test-typescript, test-rust, build, security-scan]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "CI Pipeline Summary:"
          echo "lint-python: ${{ needs.lint-python.result }}"
          echo "lint-rust: ${{ needs.lint-rust.result }}"
          echo "lint-typescript: ${{ needs.lint-typescript.result }}"
          echo "test-python-unit: ${{ needs.test-python-unit.result }}"
          echo "test-python-integration: ${{ needs.test-python-integration.result }}"
          echo "test-python-contract: ${{ needs.test-python-contract.result }}"
          echo "test-typescript: ${{ needs.test-typescript.result }}"
          echo "test-rust: ${{ needs.test-rust.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"

          # Fail if any required job failed
          if [[ "${{ needs.lint-python.result }}" != "success" ]] || \
             [[ "${{ needs.lint-rust.result }}" != "success" ]] || \
             [[ "${{ needs.lint-typescript.result }}" != "success" ]] || \
             [[ "${{ needs.test-python-unit.result }}" != "success" ]] || \
             [[ "${{ needs.test-python-integration.result }}" != "success" ]] || \
             [[ "${{ needs.test-python-contract.result }}" != "success" ]] || \
             [[ "${{ needs.test-typescript.result }}" != "success" ]] || \
             [[ "${{ needs.test-rust.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi

          echo "All required checks passed!"