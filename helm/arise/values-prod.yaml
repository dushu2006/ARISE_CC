# ARISE Production Values Override
# Production-specific overrides for the ARISE Helm chart

global:
  imageRegistry: "ghcr.io"
  imageRepository: "arise"
  imageTag: "v1.0.0"

core:
  replicaCount: 5
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 30
  resources:
    requests:
      cpu: "1500m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

postgresql:
  primary:
    persistence:
      size: "100Gi"
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

redis:
  master:
    persistence:
      size: "20Gi"
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

prometheus:
  server:
    persistentVolume:
      size: "200Gi"
    retention: "90d"

grafana:
  persistence:
    size: "50Gi"

# Production-specific settings
networkPolicies:
  enabled: true

podDisruptionBudgets:
  enabled: true

serviceMonitors:
  enabled: true